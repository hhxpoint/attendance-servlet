<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职工考勤管理系统 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        
        .login-container {
            width: 420px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            backdrop-filter: blur(10px);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-header .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: white;
        }
        
        .login-header h1 {
            font-size: 24px;
            color: #333;
            font-weight: 600;
        }
        
        .login-header p {
            color: #999;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            height: 46px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            padding: 0 16px;
            font-size: 15px;
            color: #333;
            transition: all 0.3s;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group .input-icon {
            position: absolute;
            right: 16px;
            top: 38px;
            color: #bbb;
            font-size: 18px;
        }
        
        .login-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .error-msg {
            color: #ff4757;
            font-size: 13px;
            text-align: center;
            margin-top: 16px;
            display: none;
        }
        
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        
        .remember-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666;
            font-size: 13px;
            cursor: pointer;
        }
        
        .remember-row a {
            color: #667eea;
            font-size: 13px;
            text-decoration: none;
        }
        
        .demo-accounts {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .demo-accounts p {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .demo-accounts .accounts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }
        
        .demo-accounts .account-tag {
            padding: 4px 10px;
            background: #f5f5f5;
            border-radius: 4px;
            font-size: 11px;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .demo-accounts .account-tag:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">📋</div>
            <h1>职工考勤管理系统</h1>
            <p>Employee Attendance Management System</p>
        </div>
        
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" required>
                <span class="input-icon">👤</span>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
                <span class="input-icon">🔒</span>
            </div>
            <div class="remember-row">
                <label><input type="checkbox" id="remember"> 记住密码</label>
                <a href="#">忘记密码？</a>
            </div>
            <button type="submit" class="login-btn">登 录</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
        
        <div class="demo-accounts">
            <p>演示账号（密码均为 123456）</p>
            <div class="accounts">
                <span class="account-tag" onclick="fillAccount('admin','123456')">管理员 admin</span>
                <span class="account-tag" onclick="fillAccount('wangzx','123456')">汪轩增</span>
                <span class="account-tag" onclick="fillAccount('huojw','123456')">梁宏博</span>
                <span class="account-tag" onclick="fillAccount('ningwh','123456')">贾兮雯</span>
                <span class="account-tag" onclick="fillAccount('ningwh','123456')">周童</span>
                <span class="account-tag" onclick="fillAccount('ningwh','123456')">刘鹏志</span>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script>
        function fillAccount(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
        
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            
            if (!username || !password) {
                errorMsg.textContent = '请输入用户名和密码';
                errorMsg.style.display = 'block';
                return false;
            }
            
            // 发送登录请求
            const formData = `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
            fetch(API_BASE + '/user/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData,
                credentials: 'include'
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    localStorage.setItem('currentUser', JSON.stringify(data.data));
                    window.location.href = 'pages/index.html';
                } else {
                    errorMsg.textContent = data.msg || '登录失败';
                    errorMsg.style.display = 'block';
                }
            })
            .catch(err => {
                errorMsg.textContent = '网络错误，请检查后端服务是否启动';
                errorMsg.style.display = 'block';
            });
            
            return false;
        }
        
        // 检查是否已登录
        if (localStorage.getItem('currentUser')) {
            // window.location.href = 'pages/index.html';
        }
    </script>
</body>
</html>
